services:
  pingly-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pingly}
      POSTGRES_USER: ${POSTGRES_USER:-pingly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingly_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - pingly-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pingly} -d $${POSTGRES_DB:-pingly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pingly-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - pingly-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-pingly-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-pingly}
      POSTGRES_USER: ${POSTGRES_USER:-pingly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingly_secret}
      REDIS_URL: ${REDIS_URL:-redis://pingly-redis:6379/1}
    expose:
      - "8000"
    networks:
      - pingly-internal
      - dokploy-network
    depends_on:
      pingly-db:
        condition: service_healthy
      pingly-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  pingly-internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
